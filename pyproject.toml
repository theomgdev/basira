[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "basira"
version = "0.1.0"
description = "Desktop automation where you name what you want instead of guessing where it is. AutoIt's simplicity, open-vocabulary vision, Win32 latency."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Cahit Karahan", email = "cksoftwaresystems@gmail.com" }
]
keywords = [
    "automation", "desktop-automation", "autoit", "win32", "rpa",
    "open-vocabulary", "object-detection", "yoloe", "computer-vision",
    "gui-automation", "bot", "screen-automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.22.0",
]

# The vision layer is optional on purpose: the pixel, input and window APIs are
# a few hundred KB of ctypes and must stay installable on a machine that will
# never run a neural network.
[project.optional-dependencies]
vision = ["ultralytics>=8.4.0"]
ocr = ["rapidocr>=3.0.0", "onnxruntime>=1.18.0"]
all = ["ultralytics>=8.4.0", "rapidocr>=3.0.0", "onnxruntime>=1.18.0"]

[project.urls]
Homepage = "https://github.com/theomgdev/basira"
Repository = "https://github.com/theomgdev/basira.git"
Issues = "https://github.com/theomgdev/basira/issues"

[tool.setuptools.packages.find]
include = ["basira*"]
