[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yoloe26"
version = "0.1.0"
description = "Fast, organic, and ultra-simple desktop automation library for Python, inspired by AutoIt."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Cahit Karahan", email = "cksoftwaresystems@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Desktop Environment",
]
dependencies = [
    "numpy>=1.22.0",
]

[project.urls]
Homepage = "https://github.com/theomgdev/yoloe26"
Repository = "https://github.com/theomgdev/yoloe26.git"
